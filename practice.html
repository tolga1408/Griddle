<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Griddle Practice</title><meta name="description" content="Griddle is a daily word-swap puzzle."><style>:root{--bg:#071526;--card:#0b2038;--text:#f8f1d5;--muted:#a7b4c5;--gold:#f5c84c;--green:#43b883;--yellow:#e3b744;--gray:#526174;--tile:#132f50}body.light{--bg:#f7f0dc;--card:#fff8e7;--text:#172235;--muted:#5b6575;--gold:#b8860b;--tile:#fffaf0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,var(--bg),#0b2038);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;display:flex;justify-content:center}.app{width:min(960px,100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:var(--gold);color:#071526;display:grid;place-items:center;font-weight:900;font-size:28px}h1{margin:0;font-size:clamp(32px,6vw,52px);letter-spacing:-.06em}.sub{color:var(--muted)}button,.pill{border:1px solid rgba(245,200,76,.3);border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);padding:10px 14px;cursor:pointer;font:inherit}button.primary{background:var(--gold);color:#071526;font-weight:800}.hero{display:grid;grid-template-columns:1fr 310px;gap:16px}.card{background:rgba(11,32,56,.9);border:1px solid rgba(245,200,76,.18);border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.32)}body.light .card{background:rgba(255,248,231,.95)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{text-align:center;border:1px solid rgba(245,200,76,.15);border-radius:16px;padding:10px;background:rgba(255,255,255,.05)}.stat b{display:block;color:var(--gold);font-size:24px}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase}.msg{text-align:center;color:var(--muted);font-weight:700;min-height:26px}.msg.good{color:var(--green)}.msg.bad{color:#ff6b6b}.grid{display:grid;grid-template-columns:repeat(5,clamp(48px,11vw,72px));grid-template-rows:repeat(5,clamp(48px,11vw,72px));gap:8px;justify-content:center;margin:14px 0}.tile,.hole{border-radius:16px}.hole{border:1px dashed rgba(245,200,76,.2);opacity:.25}.tile{display:grid;place-items:center;background:var(--tile);border:2px solid rgba(245,200,76,.25);font-weight:900;font-size:clamp(24px,5vw,36px);cursor:pointer}.tile.sel{outline:3px solid var(--gold)}.tile.green{background:var(--green);color:#071526}.tile.yellow{background:var(--yellow);color:#071526}.tile.gray{background:var(--gray);color:#fff}.controls,.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;color:var(--muted);font-size:14px}.result{display:none;margin-top:14px;text-align:center;border:1px solid rgba(245,200,76,.22);border-radius:18px;padding:14px;background:rgba(245,200,76,.08)}.result.show{display:block}.answer{font-weight:800;margin:10px 0;padding:10px;border-radius:12px;background:rgba(0,0,0,.15)}pre{white-space:pre-wrap;text-align:left;background:rgba(0,0,0,.18);padding:10px;border-radius:12px;overflow:auto}aside p,aside li{color:var(--muted);line-height:1.5}.note{color:var(--gold)!important;font-weight:800}footer{text-align:center;color:var(--muted);margin-top:16px}@media(max-width:800px){.hero{grid-template-columns:1fr}.top{flex-direction:column}.actions{justify-content:center}.stats,.legend{grid-template-columns:1fr}.card{padding:14px}.grid{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,minmax(44px,1fr));width:100%}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">G</div><div><h1>Griddle</h1><div class="sub" id="sub"></div></div></div><div class="actions"><span class="pill" id="datePill"></span><button id="dailyBtn">Daily</button><button id="newBtn">New</button><button id="langBtn">TR</button><button id="themeBtn">🌙</button></div></header><main class="hero"><section class="card"><div class="stats"><div class="stat"><b id="swaps">0</b><span id="lSwaps"></span></div><div class="stat"><b id="left">15</b><span id="lLeft"></span></div><div class="stat"><b id="streak">0</b><span id="lStreak"></span></div></div><div id="msg" class="msg"></div><div id="grid" class="grid"></div><div class="controls"><button class="primary" id="shareBtn"></button><button id="helpBtn"></button><button id="resetBtn"></button></div><div class="legend"><span id="lg"></span><span id="ly"></span><span id="lx"></span></div><div id="result" class="result"><h2 id="rTitle"></h2><p id="rText"></p><div id="answer" class="answer"></div><pre id="shareText"></pre><button class="primary" id="copyBtn"></button></div></section><aside class="card"><h2 id="sideTitle"></h2><p id="sideText"></p><p class="note" id="modeNote"></p><ol><li id="rule1"></li><li id="rule2"></li><li id="rule3"></li><li id="rule4"></li></ol></aside></main><footer>© Griddle</footer></div><script>
(()=>{const MAX=15,LANG_KEY='griddle-lang',THEME_KEY='griddle-theme',VERSION='daily-v1';
const P={en:[["PLACE","PHONE","RIGHT","PAPER","AMONG","EVENT"],["BRAND","SHINE","CREAM","BASIC","ALIVE","DREAM"],["SOLVE","ALTER","FORTY","STAFF","LATER","EARLY"],["ABOUT","ANGLE","TITLE","APART","OUGHT","THESE"],["BLESS","SORRY","NURSE","BASIN","ERROR","STYLE"],["GUEST","ERROR","STYLE","GUESS","EARLY","THREE"],["UPSET","AHEAD","ENEMY","USAGE","SCENE","TODAY"],["SCOPE","ANGER","ENTER","SPARE","OUGHT","ERROR"],["METAL","AFTER","THEME","MEANT","TITLE","LARGE"],["CHASE","OUGHT","ERROR","CLOSE","ANGER","ENTER"]],tr:[["KAYAK","LİMAN","MAKET","KALEM","YEMEK","KANAT"],["HALKA","SAKAL","PAMUK","HESAP","LOKUM","ANLIK"],["MEYVE","KARAR","SALON","MAKAS","YEREL","EKRAN"],["YATAK","KAVUN","ŞEKER","YOKUŞ","TAVUK","KENAR"],["KAHVE","BİZİM","KURAK","KABAK","HAZIR","EKMEK"],["YASAK","KİBAR","ŞEHİR","YOKUŞ","SABAH","KARAR"],["TABAK","KALIN","MOTOR","TAKIM","BULUT","KENAR"],["KABAK","SALON","PAKET","KASAP","BALIK","KANAT"],["ALMAK","BAKIR","MASAL","ALBÜM","MAKAS","KURAL"],["TAKIM","BEYAZ","KAPAK","TABAK","KAYIP","MÜZİK"],["BAKLA","BİLET","KANUN","BEBEK","KALAN","ALTIN"],["ÇELİK","ÇAKIL","KALEM","ÇİÇEK","LOKAL","KİLİM"],["BATIK","CEVAP","KONAK","BÖCEK","TAVAN","KAPAK"],["DURAK","NİSAN","ARMUT","DÜNYA","RESİM","KANAT"]]};
const T={en:{sub:'Unlimited practice mode',daily:'Practice',practice:'Daily',lang:'TR',swaps:'Swaps',left:'Left',streak:'Solved',start:'Swap two letters to solve all six words.',pick:'Now click another letter to swap.',win:n=>`Solved in ${n} swaps.`,lose:'No swaps left. Answers are below.',share:'Share',help:'How to play',reset:'Reset',copy:'Copy result',green:'🟩 Correct',yellow:'🟨 In a word',gray:'⬜ Not here',side:'Practice mode',sideText:'Play unlimited random Griddle boards.',note:'Practice does not affect your daily streak.',r1:'Click one letter, then another, to swap.',r2:'Green is correct.',r3:'Yellow is in the word but wrong place.',r4:'Use New for another puzzle.',winTitle:'Griddle solved!',loseTitle:'Out of swaps',winText:n=>`You solved this practice Griddle in ${n}/${MAX} swaps.`,loseText:'The six words:',across:'Across',down:'Down',copied:'Copied.'},tr:{sub:'Sınırsız pratik modu',daily:'Pratik',practice:'Günlük',lang:'EN',swaps:'Hamle',left:'Kalan',streak:'Çözülen',start:'6 kelimeyi çözmek için iki harfin yerini değiştir.',pick:'Şimdi ikinci harfi seç.',win:n=>`${n} hamlede çözüldü.`,lose:'Hamle hakkın bitti. Cevaplar aşağıda.',share:'Paylaş',help:'Nasıl oynanır',reset:'Sıfırla',copy:'Sonucu kopyala',green:'🟩 Doğru',yellow:'🟨 Kelimede var',gray:'⬜ Burada değil',side:'Pratik modu',sideText:'Sınırsız rastgele Griddle tahtası oyna.',note:'Pratik günlük serini etkilemez.',r1:'Bir harfe, sonra ikinci harfe tıkla.',r2:'Yeşil doğru yerdedir.',r3:'Sarı kelimede vardır ama yanlış yerdedir.',r4:'Yeni butonuyla başka bulmaca aç.',winTitle:'Griddle çözüldü!',loseTitle:'Hamle bitti',winText:n=>`Bu pratik Griddle ${n}/${MAX} hamlede çözüldü.`,loseText:'Altı kelime:',across:'Yatay',down:'Dikey',copied:'Kopyalandı.'}};
const coords=[],map=new Map();for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(r%2===0||c%2===0){map.set(r+','+c,coords.length);coords.push([r,c]);}
const lines=[[[0,0],[0,1],[0,2],[0,3],[0,4]],[[2,0],[2,1],[2,2],[2,3],[2,4]],[[4,0],[4,1],[4,2],[4,3],[4,4]],[[0,0],[1,0],[2,0],[3,0],[4,0]],[[0,2],[1,2],[2,2],[3,2],[4,2]],[[0,4],[1,4],[2,4],[3,4],[4,4]]].map(a=>a.map(([r,c])=>map.get(r+','+c)));
let lang=localStorage.getItem(LANG_KEY)||((navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en');let seed=localStorage.getItem('griddle-practice-seed')||String(Date.now());localStorage.setItem('griddle-practice-seed',seed);let date='Practice';let words=P[lang][hash(seed+lang)%P[lang].length],sol=boardFrom(words),initial=scramble(sol,hash(seed+lang+words.join(''))),board=load()?.board||initial.slice(),sw=load()?.swaps||0,over=load()?.over||false,won=load()?.won||false,sel=null;
function hash(s){let h=2166136261;for(let ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rnd(seed){return()=>{let t=seed+=1831565813;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function boardFrom(w){let g=Array.from({length:5},()=>Array(5).fill(''));[0,1,2].forEach(i=>{for(let c=0;c<5;c++)g[i*2][c]=w[i][c]});[3,4,5].forEach((wi,i)=>{for(let r=0;r<5;r++)g[r][i*2]=w[wi][r]});return coords.map(([r,c])=>g[r][c])}function scramble(a,seed){let r=rnd(seed),b=a.slice();for(let i=0;i<12;i++){let x=Math.floor(r()*b.length),y=Math.floor(r()*b.length);if(x!==y)[b[x],b[y]]=[b[y],b[x]]}return b}function key(){return VERSION+'-'+lang+'-'+date}function save(){localStorage.setItem(key(),JSON.stringify({board,swaps:sw,over,won}))}function load(){try{return JSON.parse(localStorage.getItem(key()))}catch{return null}}function stats(){return{current:localStorage.getItem('griddle-practice-solved-'+lang)||0}}function lineScore(cur,tgt){let st=Array(5).fill('gray'),rem={};for(let i=0;i<5;i++)cur[i]===tgt[i]?st[i]='green':rem[tgt[i]]=(rem[tgt[i]]||0)+1;for(let i=0;i<5;i++)if(st[i]!=='green'&&rem[cur[i]]){st[i]='yellow';rem[cur[i]]--}return st}function statuses(){let rank={gray:0,yellow:1,green:2},best=Array(board.length).fill('gray');for(let li of lines){let st=lineScore(li.map(i=>board[i]),li.map(i=>sol[i]));st.forEach((s,p)=>{if(rank[s]>rank[best[li[p]]])best[li[p]]=s})}return best}
function render(){let t=T[lang],s=stats();sub.textContent=t.sub;datePill.textContent=t.daily;langBtn.textContent=t.lang;dailyBtn.textContent=t.practice;newBtn.textContent=lang==='tr'?'Yeni':'New';lSwaps.textContent=t.swaps;lLeft.textContent=t.left;lStreak.textContent=t.streak;shareBtn.textContent=t.share;helpBtn.textContent=t.help;resetBtn.textContent=t.reset;copyBtn.textContent=t.copy;lg.textContent=t.green;ly.textContent=t.yellow;lx.textContent=t.gray;sideTitle.textContent=t.side;sideText.textContent=t.sideText;modeNote.textContent=t.note;rule1.textContent=t.r1;rule2.textContent=t.r2;rule3.textContent=t.r3;rule4.textContent=t.r4;swaps.textContent=sw;left.textContent=Math.max(0,MAX-sw);streak.textContent=s.current||0;msg.className='msg';msg.textContent=over?(won?t.win(sw):t.lose):(sel===null?t.start:t.pick);if(over)msg.classList.add(won?'good':'bad');renderGrid();result.classList.toggle('show',over);if(over){rTitle.textContent=won?t.winTitle:t.loseTitle;rText.textContent=won?t.winText(sw):t.loseText;answer.textContent=`${t.across}: ${words.slice(0,3).join(' / ')} · ${t.down}: ${words.slice(3).join(' / ')}`;shareText.textContent=share();}themeBtn.textContent=document.body.classList.contains('light')?T[lang].light||'☀️':T[lang].dark||'🌙'}
function renderGrid(){let st=statuses();grid.innerHTML='';for(let r=0;r<5;r++)for(let c=0;c<5;c++){let i=map.get(r+','+c);if(i===undefined){let h=document.createElement('div');h.className='hole';grid.appendChild(h)}else{let b=document.createElement('button');b.className='tile '+st[i]+(sel===i?' sel':'');b.textContent=board[i];b.dataset.i=i;grid.appendChild(b)}}}
function click(e){let b=e.target.closest('.tile');if(!b||over)return;let i=+b.dataset.i;if(sel===null){sel=i;render();return}if(sel===i){sel=null;render();return}[board[sel],board[i]]=[board[i],board[sel]];sw++;sel=null;if(board.every((v,j)=>v===sol[j])){won=over=true;record(true)}else if(sw>=MAX){over=true;record(false)}save();render()}function record(win){if(win&&!localStorage.getItem(key()+'-counted')){localStorage.setItem('griddle-practice-solved-'+lang,String((+localStorage.getItem('griddle-practice-solved-'+lang)||0)+1));localStorage.setItem(key()+'-counted','1')}}function share(){let st=statuses(),out=[`Griddle ${lang.toUpperCase()} Practice ${won?sw:'X'}/${MAX}`,`${T[lang].streak}: ${(stats().current||0)}`,''];for(let r=0;r<5;r++){let row='';for(let c=0;c<5;c++){let i=map.get(r+','+c);row+=i===undefined?'⬛':st[i]==='green'?'🟩':st[i]==='yellow'?'🟨':'⬜'}out.push(row)}return out.join('\n')}
grid.addEventListener('click',click);resetBtn.onclick=()=>{board=initial.slice();sw=0;over=won=false;sel=null;localStorage.removeItem(key());render()};newBtn.onclick=()=>{localStorage.setItem('griddle-practice-seed',String(Date.now()+Math.random()));localStorage.removeItem(key());location.reload()};dailyBtn.onclick=()=>location.href='index.html';langBtn.onclick=()=>{localStorage.setItem(LANG_KEY,lang==='en'?'tr':'en');localStorage.setItem('griddle-practice-seed',String(Date.now()+Math.random()));location.reload()};themeBtn.onclick=()=>{document.body.classList.toggle('light');localStorage.setItem(THEME_KEY,document.body.classList.contains('light')?'light':'dark');render()};shareBtn.onclick=copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(share());alert(T[lang].copied)}catch{}};helpBtn.onclick=()=>alert(T[lang].sideText);if(localStorage.getItem(THEME_KEY)==='light')document.body.classList.add('light');render();})();
</script></body></html>
